asyncapi: 3.0.0
info:
  title: Orders and payments
  version: 1.0.0
servers:
  broker:
    host: broker.internal:5672
    protocol: amqp
  events:
    host: kafka.internal:9092
    protocol: kafka
channels:
  orderCreated:
    address: order.created
    messages:
      OrderCreated:
        payload:
          $ref: '#/components/schemas/OrderCreated'
  orderShipped:
    address: order.shipped
    messages:
      ShipmentEvent:
        payload:
          $ref: '#/components/schemas/ShipmentEvent'
  orderRefunded:
    address: order.refunded.v1
  orderAudit:
    address: 'order.audit.{region}'
  paymentsCaptured:
    address: payments.captured
    servers:
      - $ref: '#/servers/broker'
    messages:
      PaymentEvent:
        payload:
          $ref: '#/components/schemas/PaymentEvent'
operations:
  sendOrderCreated:
    action: send
    channel:
      $ref: '#/channels/orderCreated'
  receiveOrderCreated:
    action: receive
    channel:
      $ref: '#/channels/orderCreated'
  sendOrderShipped:
    action: send
    channel:
      $ref: '#/channels/orderShipped'
  receiveOrderShipped:
    action: receive
    channel:
      $ref: '#/channels/orderShipped'
  receiveOrderRefunded:
    action: receive
    channel:
      $ref: '#/channels/orderRefunded'
  receivePaymentsCaptured:
    action: receive
    channel:
      $ref: '#/channels/paymentsCaptured'
components:
  schemas:
    OrderCreated:
      type: object
      required: [orderId, total]
      properties:
        orderId:
          type: string
        total:
          type: string
    ShipmentEvent:
      type: object
      required: [orderId, carrier]
      properties:
        orderId:
          type: string
        carrier:
          type: string
    PaymentEvent:
      type: object
      required: [orderId, amount]
      properties:
        orderId:
          type: string
        amount:
          type: integer
