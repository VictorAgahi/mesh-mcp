# Fixture: a Spring Boot service that talks to RabbitMQ, JMS, SQS / SNS, Redis, NATS and Pub/Sub.
[workspace]
name = "jvm-brokers"
version = "1.0.0"
roots = ["."]
exclude_patterns = ["**/target/**"]

[engines.docs]
enabled = true

[engines.contracts]
enabled = true

[engines.contracts.spring]
enabled = true
property_files = ["**/src/main/resources/application*.yml"]
resolve_placeholders = true
