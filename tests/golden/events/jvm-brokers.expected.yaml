chains:
  # RabbitMQ `orders` -> billing -> routing key `invoices.issued` -> mail -> JMS `mail.outbox`.
  # It must not start from the SQS `orders` producer.
  - id: ch1
    entry: {kind: topic, value: "rabbitmq:orders"}
    direction: forward
    steps:
      - {kind: consume, file: src/main/java/com/acme/jvm/OrderRabbitListener.java, line: 15, topic: "rabbitmq:orders"}
      - {kind: call, file: src/main/java/com/acme/jvm/BillingService.java, line: 15}
      - {kind: produce, file: src/main/java/com/acme/jvm/BillingService.java, line: 16, topic: invoices.issued}
      - {kind: consume, file: src/main/java/com/acme/jvm/InvoiceMailListener.java, line: 18, topic: invoices.issued}
      - {kind: call, file: src/main/java/com/acme/jvm/MailService.java, line: 15}
      - {kind: produce, file: src/main/java/com/acme/jvm/MailService.java, line: 16, topic: mail.outbox}
      - {kind: consume, file: src/main/java/com/acme/jvm/MailOutboxListener.java, line: 9, topic: mail.outbox}
    tags: [layered_calls, jvm_broker, broker_key]
    min_hops: 2
  # SQS `orders` -> notification -> SNS `order-events`.
  - id: ch2
    entry: {kind: topic, value: "sqs:orders"}
    direction: forward
    steps:
      - {kind: consume, file: src/main/java/com/acme/jvm/OrderQueues.java, line: 22, topic: "sqs:orders"}
      - {kind: call, file: src/main/java/com/acme/jvm/NotificationService.java, line: 16}
      - {kind: produce, file: src/main/java/com/acme/jvm/NotificationService.java, line: 17, topic: order-events}
    tags: [layered_calls, jvm_broker, broker_key]
    min_hops: 1

