# Hand-annotated from the source of examples/eda/jvm-brokers. Never generated from tool output.
# Java only: a Spring service on RabbitMQ, JMS, SQS / SNS, Redis, NATS and Pub/Sub (9.0 T8a).
# The channel key of each site is the name the call site shows:
#  - RabbitMQ: the queue of `@RabbitListener(queues = ...)`, the routing key of a
#    `@QueueBinding` (else its queue), the routing key of `convertAndSend(exchange, key, msg)`
#    or the queue of `convertAndSend(queue, msg)` (the default exchange);
#  - SQS / SNS: the last segment of a queue URL or topic ARN, or the queue name;
#  - JMS, Redis, NATS, Pub/Sub: the destination, channel, subject or topic.
# `orders` is a RabbitMQ queue and an SQS queue, `audit.events` a RabbitMQ queue and a NATS
# subject: two channels each, so `<broker>:<name>` (SCHEMA.md). Every other name is used on one
# broker only and keeps its plain spelling.
# `refunds.requested` is `app.queues.refunds` of src/main/resources/application.yml.
# `ShipmentHandlers` listens at class level (`@RabbitListener` + `@RabbitHandler` methods): the
# class is the one consumer of `shipments`.
# Decoys.java holds one site, `legacy.pp` (its payload `body` is not a channel), and decoys: a
# `convertAndSend` of an unrelated class, a string in a log line, a queue name that is a
# parameter, a destination that is a method result, a request built elsewhere, a routing-key
# pattern. Shadowed.java holds none: a nested RabbitTemplate class, a for-each variable and a
# lambda parameter hide the field, and its import is in a comment.
# src/test/... holds a real-looking `convertAndSend`: the scorer ignores test files.
corpus: jvm-brokers
root: examples/eda/jvm-brokers
config: mesh-mcp.toml
languages: [java]

