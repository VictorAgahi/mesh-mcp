# Hand-annotated from the source of examples/eda/py-brokers. Never generated from tool output.
# Python only: services on RabbitMQ (pika, aio-pika, kombu), Redis, NATS, SQS / SNS, Pub/Sub and
# Kafka (9.0 T8c). The channel key of each site is the name the call site shows:
#  - RabbitMQ: the routing key of a publish (a publish to the default exchange names the queue
#    there), the queue of a consume / get / `queue.consume()`, the queues of a kombu `Consumer`;
#  - Redis, NATS: the channel or subject; a keyword of `pubsub.subscribe(heartbeat=...)` is the channel;
#  - SQS / SNS: the last segment of a queue URL or topic ARN (or the queue a `get_queue_url` names);
#  - Pub/Sub: the topic of `publisher.topic_path(...)`; a `subscriber.subscribe(sub)` is a consumer of
#    the topic the file creates `sub` on (`create_subscription(name=sub, topic=topic)`), else of nothing;
#  - Kafka: only the gaps of the older reader (`KafkaConsumer("a", "b")`, `subscribe(topics=[...])`)
#    and the `send` of a bound producer.
# `orders` is a RabbitMQ queue and an SQS queue, `audit.events` a RabbitMQ queue and a NATS subject,
# `payments.settled` a Kafka topic and a Redis channel: several channels each, so `<broker>:<name>`
# (SCHEMA.md). Every other name is used on one broker only and keeps its plain spelling.
# `payments.queue` is `PAYMENTS_QUEUE` and `orders.dead` is `ORDERS_DEAD_LETTER` of the corpus docker-compose.yml;
# the `os.getenv` default `payments.fallback` is never a name.
# decoys.py holds no site: a class of the file named Bus, log-line and print literals, channel names
# that are a parameter, an f-string or a concatenation. shadowed.py holds one site, `shadow.nats.real`:
# its commented-out imports, a parameter, a comprehension variable, a lambda parameter, a loop
# variable and a local class all hide the boto3 client, and `pika` is never imported.
# wrapper.py holds a wrapper class per broker (`KafkaBus`, `RabbitBus`) that owns a client: the topic
# of `bus.publish("bus.topic", 1)` is a producer on the calling function (the wrapper's own
# `produce(topic, ...)` names nothing), unlike the `Bus` of decoys.py, which owns no client.
# tests/test_publish.py holds a real-looking publish: the scorer ignores test files.
corpus: py-brokers
